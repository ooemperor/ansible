---
- name: Setup cadvisor docker container
  community.docker.docker_container:
    name: "{{ cadvisor_container_name }}"
    image: "{{ cadvisor_image }}:{{ cadvisor_image_version }}"
    recreate: "{{ cadvisor_recreate }}"
    pull: "{{ cadvisor_pull }}"
    restart_policy: "{{ cadvisor_restart_policy }}"
    ports:
      - "{{ cadvisor_port }}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
